# TEMPLATE — Docker Compose for IBVAP Single-Node Deployment
# Status: TEMPLATE / PLANNED — not validated for production use
# Edit all environment variables before deploying

version: "3.9"

services:
  backend:
    build:
      context: ../..
      dockerfile: deployment/single_node/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../../data:/app/data
      - ../../configs:/app/configs
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///./data/ibvap_prod.db
      - IBVAP_JWT_SECRET=${IBVAP_JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=["https://your-dashboard-domain.com"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"  # RTSP
      - "8889:8889"  # WebRTC
    volumes:
      - ../../infrastructure/mediamtx/mediamtx.yml:/mediamtx.yml
    restart: unless-stopped

# NOTE: inference worker runs as a separate process — not containerized yet
# Future: add inference service here
