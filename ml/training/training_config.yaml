# Training Configuration — IBVAP Custom Model
# Status: NOT_DONE — requires labeled dataset before running
# Run: yolo train cfg=ml/training/training_config.yaml

# Base model
model: yolov8n.pt       # Pretrained baseline — fine-tune from here

# Dataset
data: ml/datasets/dataset.yaml   # Generated after dataset collection

# Training parameters
epochs: 100
batch: 16
imgsz: 640
device: cpu             # Change to 0 for NVIDIA GPU

# Output
project: ml/runs
name: ibvap_v1

# Augmentation (border surveillance domain)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0            # Small rotation (cameras are fixed)
translate: 0.1
scale: 0.5
shear: 0.0
flipud: 0.0             # Never flip upside-down
fliplr: 0.5

# Evaluation gates — training is not accepted unless ALL pass
evaluation_gates:
  min_mAP50: 0.70               # Domain-specific threshold
  min_mAP50_95: 0.50
  max_false_positive_rate: 0.10
  max_false_negative_rate: 0.15
  max_inference_ms: 100         # CPU inference per frame

# Metrics to record
metrics:
  - precision
  - recall
  - mAP50
  - mAP50-95
  - inference_ms
  - fps

# Metadata to record in model_registry.yaml after training
record_metadata:
  - model_version
  - dataset_version
  - dataset_hash
  - training_config_hash
  - hardware
  - runtime_seconds
  - timestamp
  - python_version
  - ultralytics_version
